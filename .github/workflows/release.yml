name: Build and release
on:
  push:
    branches: [release/0.8.23]
    paths: [Info.plist, main.m, UpdateCheck.h, DisplayModePolicy.h, NativeDisplayModes.h, DisplayStateHelper.m, 'Brightness*', 'ThirdParty/**', 'tests/**', build.sh, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test update selection and daily scheduling
        run: |
          clang -Wall -Wextra -fobjc-arc -framework Foundation tests/update-check.m -o "$RUNNER_TEMP/retina-update-tests"
          "$RUNNER_TEMP/retina-update-tests"
      - name: Test DDC brightness protocol
        run: |
          clang -Wall -Wextra -Werror tests/brightness-protocol.c -o /tmp/brightness-tests
          /tmp/brightness-tests
      - name: Test inline brightness menu
        run: |
          clang -Wall -Wextra -fobjc-arc -framework Cocoa -framework CoreGraphics -framework ColorSync -I . tests/brightness-menu.m BrightnessController.m -o "$RUNNER_TEMP/brightness-menu-tests"
          "$RUNNER_TEMP/brightness-menu-tests"
      - name: Test physical-first display management
        run: |
          clang -Wall -Wextra -fobjc-arc -fmodules -mmacosx-version-min=13.0 -framework Cocoa -framework CoreGraphics -framework ColorSync -framework ServiceManagement tests/display-policy.m BrightnessController.m -o "$RUNNER_TEMP/display-policy-tests"
          "$RUNNER_TEMP/display-policy-tests"
      - name: Test unified display settings without changing displays
        run: |
          clang -Wall -Wextra -Werror -fobjc-arc -fmodules -mmacosx-version-min=13.0 -framework Cocoa -framework CoreGraphics -framework ColorSync -framework ServiceManagement tests/unified-settings.m BrightnessController.m -o "$RUNNER_TEMP/unified-settings-tests"
          "$RUNNER_TEMP/unified-settings-tests"
          clang -Wall -Wextra -Werror -fobjc-arc -fmodules -mmacosx-version-min=13.0 -framework Cocoa -framework CoreGraphics -framework ColorSync -framework ServiceManagement tests/hidden-native-picker.m BrightnessController.m -o "$RUNNER_TEMP/hidden-native-picker-tests"
          "$RUNNER_TEMP/hidden-native-picker-tests"
      - name: Test hidden native mode matching without changing displays
        run: |
          clang -Wall -Wextra -Werror -fobjc-arc -framework Foundation -framework CoreGraphics -framework ColorSync tests/native-display-modes.m -o "$RUNNER_TEMP/hidden-native-mode-tests"
          "$RUNNER_TEMP/hidden-native-mode-tests"
          clang -Wall -Wextra -Werror -fobjc-arc -framework Cocoa -framework CoreGraphics -framework ColorSync -framework CoreVideo tests/display-state-helper.m -o "$RUNNER_TEMP/display-state-helper-tests"
          "$RUNNER_TEMP/display-state-helper-tests"
      - name: Test physical-display refresh options
        run: |
          clang -Wall -Wextra -Werror -fobjc-arc -fmodules -mmacosx-version-min=13.0 -framework Cocoa -framework CoreGraphics -framework ColorSync -framework ServiceManagement tests/refresh-options.m BrightnessController.m -o "$RUNNER_TEMP/refresh-options-tests"
          "$RUNNER_TEMP/refresh-options-tests"
          clang -Wall -Wextra -Werror -fobjc-arc -fmodules -mmacosx-version-min=13.0 -framework Cocoa -framework CoreGraphics -framework ColorSync -framework ServiceManagement tests/read-only-display-modes.m BrightnessController.m -o "$RUNNER_TEMP/native-mode-tests"
          "$RUNNER_TEMP/native-mode-tests"
      # All mirror tests use a mock backend; do not change runner displays.
      - name: Test virtual-source mirroring and rollback
        run: |
          clang -Wall -Wextra -Werror -fobjc-arc -fmodules -mmacosx-version-min=13.0 -framework Cocoa -framework CoreGraphics -framework ColorSync -framework ServiceManagement tests/virtual-mirror.m BrightnessController.m -o "$RUNNER_TEMP/mirror-tests"
          "$RUNNER_TEMP/mirror-tests"
      - name: Build and verify
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" zsh ./build.sh
          unzip -t '../../outputs/Retina-Dummy.zip'
          test "$VERSION" = 0.8.23
          codesign --verify --deep --strict '../../outputs/Retina Dummy.app'
          lipo '../../outputs/Retina Dummy.app/Contents/MacOS/RetinaDummy' -verify_arch arm64 x86_64
          lipo '../../outputs/Retina Dummy.app/Contents/Resources/RetinaDisplayState' -verify_arch arm64 x86_64
          git archive --format=zip HEAD -o '../../outputs/Retina-Dummy-Source.zip'
          cp LICENSE '../../outputs/MIT-LICENSE.txt'
          (cd ../../outputs && shasum -a 256 Retina-Dummy.zip Retina-Dummy-Source.zip > SHA256SUMS.txt)
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace published files."
            exit 1
          fi
          gh release create "$TAG" '../../outputs/Retina-Dummy.zip' '../../outputs/Retina-Dummy-Source.zip' '../../outputs/MIT-LICENSE.txt' '../../outputs/SHA256SUMS.txt' --target "$GITHUB_SHA" --title "Retina Dummy $TAG" --notes-file RELEASE-0.8.23.md --latest
